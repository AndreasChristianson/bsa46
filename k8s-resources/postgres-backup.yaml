# Nightly logical dump of the drupal database to glowbox's db-dumps export,
# which homelab syncs to s3://pessimistic-it-k8s-volume-backup/db-dumps at
# 06:25 host time. The nas-db-dumps StorageClass
# (AndreasChristianson/k8s-resources) maps the PVC to the folder
# db-dumps/troop-46, the same one every night.
#
# One fixed filename (S3 keeps 7 days of old versions), temp file + rename,
# ZFS snapshots for local history. The pg_dump image must be at
# least the server's major version (18).
#
# Restore (drupal scaled to 0 first):
#   gunzip -c drupal.sql.gz | kubectl -n troop-46 exec -i postgres-0 -- psql -U <user> -d drupal
# then re-apply the database-level setting Drupal requires, which pg_dump of a
# single database does NOT carry over (lost once in the 2026-11 migration):
#   kubectl -n troop-46 exec postgres-0 -- psql -U <user> -d drupal \
#     -c "ALTER DATABASE drupal SET bytea_output = 'escape'"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dumps
  namespace: troop-46
spec:
  storageClassName: nas-db-dumps
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: troop-46
spec:
  # Well before the 06:25 S3 sync; offset from spoolman (05:00), keycloak (05:15).
  schedule: "30 5 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: pg-dump
              image: postgres:18.6
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 256Mi
                  cpu: 200m
              env:
                - name: PGHOST
                  value: postgres-service
                - name: PGDATABASE
                  value: drupal
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: password
              # Runs as the image's default root (the export is no_root_squash).
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  dir=/dumps
                  pg_dump --no-owner --clean --if-exists | gzip > "$dir/.drupal.sql.gz.tmp"
                  mv "$dir/.drupal.sql.gz.tmp" "$dir/drupal.sql.gz"
                  ls -l "$dir"
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: db-dumps
