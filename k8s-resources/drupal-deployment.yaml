apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupal-deployment
  namespace: troop-46
spec:
  # Explicit so an apply restores it after the manual scale-to-0 used when
  # copying the volume (see the drupal-data PVC below).
  replicas: 1
  selector:
    matchLabels:
      app: drupal
  template:
    metadata:
      labels:
        app: drupal
    spec:
      containers:
        - image: drupal:11.4.11
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/php/php.ini
              subPath: php.ini
            - name: drupal
              mountPath: /var/www/html/modules
              subPath: modules
            - name: drupal
              mountPath: /var/www/html/profiles
              subPath: profiles
            - name: drupal
              mountPath: /var/www/html/themes
              subPath: themes
            - name: drupal
              mountPath: /var/www/html/sites
              subPath: sites
          name: drupal
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: 512Mi
              cpu: 800m
            requests:
              memory: 32Mi
              cpu: 10m
      volumes:
        - name: drupal
          persistentVolumeClaim:
            claimName: drupal-data
        - name: config
          configMap:
            name: config
            items:
              - key: php.ini
                path: php.ini
---
apiVersion: v1
kind: Service
metadata:
  name: drupal-service
  namespace: troop-46
spec:
  ports:
    - name: server
      port: 8000
      targetPort: 80
  selector:
    app: drupal
---
# modules/, profiles/, themes/ and sites/ (uploads in sites/default/files),
# about 14 MB. On glowbox's nas-nfs export, like postgres. The previous
# nas-hostpath PVC `drupal` is no longer referenced but is left in the cluster
# (apply never deletes) as the rollback copy; remove it by hand once this has
# run for a while.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drupal-data
  namespace: troop-46
spec:
  storageClassName: nas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
