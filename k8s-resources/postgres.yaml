# troop-46 Postgres. A StatefulSet so a rollout can never run two postmasters
# against one PGDATA (the old RollingUpdate Deployment could). Data is on the
# nas-nfs StorageClass (glowbox:/nas/k8s/nfs-volumes), not node hostpath.
#
# Migrated 2026-11 by dump/restore from the old Deployment `postgres` + PVC
# `postgres-pvc`. `kubectl apply` never prunes, so those stay in the cluster
# until deleted by hand.
#
# postgres:18 keeps its data in /var/lib/postgresql/<major>/docker, so the PVC
# is mounted at /var/lib/postgresql and a future major upgrade gets a sibling dir.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: troop-46
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.1
          ports:
            - containerPort: 5432
          resources:
            limits:
              memory: 256Mi
              cpu: 200m
            requests:
              memory: 64Mi
              cpu: 10m
          env:
            - name: POSTGRES_DB
              value: drupal
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d drupal']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d drupal']
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: nas-nfs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: troop-46
spec:
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: postgres
