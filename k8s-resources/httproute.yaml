# bsa46.com on the Envoy Gateway (k8s-resources#91). The listener
# (https-bsa46) and its certificate are owned by k8s-resources. Public, no
# auth. Replaces ingress.yaml once the Gateway takes over 80/443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drupal
  namespace: troop-46
spec:
  parentRefs:
    - name: glowbox
      namespace: envoy-gateway-system
      sectionName: https-bsa46
  hostnames:
    - bsa46.com
  rules:
    - backendRefs:
        - name: drupal-service
          port: 8000
      # Envoy's default is 15s for the whole request, too short for a 50 MB
      # upload (nginx had proxy-body-size 50m; Envoy has no body limit here).
      timeouts:
        request: 300s
